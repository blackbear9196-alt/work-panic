<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WORK PANIC — I got the message. Now what?</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f6f7fb;color:#111827}
.wrap{max-width:900px;margin:auto;padding:28px 18px}.brand{font-weight:900;font-size:28px;letter-spacing:-1px}.tag{color:#6b7280;margin-top:4px}
.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin-top:20px;box-shadow:0 8px 30px rgba(0,0,0,.05)}
h1{font-size:32px;margin:0 0 8px}.muted{color:#6b7280}.hidden{display:none!important}
input,textarea{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;margin-top:8px}
textarea{min-height:150px;resize:vertical}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;margin:8px 6px 0 0}
.primary{background:#111827;color:#fff}.secondary{background:#eef2f7;color:#111827}.danger{background:#fee2e2;color:#991b1b}
.row{display:flex;gap:10px;flex-wrap:wrap}.result{white-space:pre-wrap;line-height:1.55}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#eef2ff;margin:4px 5px 4px 0;font-size:13px}
label{display:block;font-weight:700;margin-top:12px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}
.small{font-size:13px}.error{color:#b91c1c;margin-top:10px}.success{color:#047857;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="brand">WORK PANIC</div><div class="tag">I got the message. Now what?</div></div>
    <button id="logoutBtn" class="danger hidden">Log out</button>
  </div>

  <div id="authCard" class="card">
    <h1 id="authTitle">Create your account</h1>
    <p class="muted">Use your email and password to access WORK PANIC.</p>
    <label>Email</label>
    <input id="email" type="email" placeholder="you@example.com">
    <label>Password</label>
    <input id="password" type="password" placeholder="At least 6 characters">
    <div class="row">
      <button id="authBtn" class="primary">Sign up</button>
      <button id="toggleBtn" class="secondary">I already have an account</button>
    </div>
    <div id="authMsg" class="small"></div>
  </div>

  <div id="appCard" class="hidden">
    <div class="card">
      <h1>What do they want?</h1>
      <p class="muted">Paste the work message or upload a screenshot.</p>
      <textarea id="message" placeholder="Paste email, Slack, Teams, text message, etc."></textarea>
      <label>Screenshot (optional)</label>
      <input id="screenshot" type="file" accept="image/*">
      <div class="row">
        <button id="analyzeBtn" class="primary">Analyze</button>
        <button id="clearBtn" class="secondary">Clear</button>
      </div>
      <div id="appMsg" class="small"></div>
    </div>

    <div id="resultCard" class="card hidden">
      <h2>WORK PANIC Result</h2>
      <div><strong>What they want</strong><div id="want" class="result"></div></div>
      <div style="margin-top:18px"><strong>Tasks</strong><div id="tasks"></div></div>
      <div style="margin-top:18px"><strong>Deadline</strong><div id="deadline"></div></div>
      <div style="margin-top:18px"><strong>Priority</strong><div id="priority"></div></div>
      <div style="margin-top:18px"><strong>Professional reply</strong><div id="reply" class="result"></div></div>
      <div class="row">
        <button id="copyBtn" class="secondary">Copy Reply</button>
        <button id="shortBtn" class="secondary">Shorter</button>
        <button id="confBtn" class="secondary">More Confident</button>
      </div>
    </div>
  </div>
</div>

<script>
let sb=null, signupMode=true, lastReply="";

async function init(){
  try{
    const r=await fetch("/api/config");
    const cfg=await r.json();
    if(!cfg.supabaseUrl || !cfg.supabasePublishableKey){
      document.getElementById("authMsg").textContent="Supabase configuration is missing on the server.";
      return;
    }
    sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);
    const {data}=await sb.auth.getSession();
    renderAuth(data.session);
    sb.auth.onAuthStateChange((_event,session)=>renderAuth(session));
  }catch(e){document.getElementById("authMsg").textContent=e.message}
}

function renderAuth(session){
  document.getElementById("authCard").classList.toggle("hidden",!!session);
  document.getElementById("appCard").classList.toggle("hidden",!session);
  document.getElementById("logoutBtn").classList.toggle("hidden",!session);
}

document.getElementById("toggleBtn").onclick=()=>{
  signupMode=!signupMode;
  document.getElementById("authTitle").textContent=signupMode?"Create your account":"Log in";
  document.getElementById("authBtn").textContent=signupMode?"Sign up":"Log in";
  document.getElementById("toggleBtn").textContent=signupMode?"I already have an account":"Create an account";
  document.getElementById("authMsg").textContent="";
};

document.getElementById("authBtn").onclick=async()=>{
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const msg=document.getElementById("authMsg");
  msg.className="small";
  if(!email||!password){msg.textContent="Enter email and password.";return}
  const result=signupMode
    ? await sb.auth.signUp({email,password})
    : await sb.auth.signInWithPassword({email,password});
  if(result.error){msg.className="small error";msg.textContent=result.error.message;return}
  if(signupMode && !result.data.session){
    msg.className="small success";
    msg.textContent="Account created. Check your email to confirm your account, then log in.";
  }
};

document.getElementById("logoutBtn").onclick=()=>sb.auth.signOut();

document.getElementById("analyzeBtn").onclick=async()=>{
  const btn=document.getElementById("analyzeBtn"), msg=document.getElementById("appMsg");
  const text=document.getElementById("message").value.trim();
  const file=document.getElementById("screenshot").files[0];
  if(!text&&!file){msg.className="small error";msg.textContent="Paste a message or upload a screenshot.";return}
  btn.disabled=true; msg.className="small"; msg.textContent="Analyzing...";
  try{
    const fd=new FormData();
    if(text)fd.append("text",text);
    if(file)fd.append("screenshot",file);
    const r=await fetch("/api/analyze",{method:"POST",body:fd});
    const data=await r.json();
    if(!r.ok)throw new Error(data.error||"Analysis failed.");
    document.getElementById("want").textContent=data.whatTheyWant;
    document.getElementById("deadline").textContent=data.deadline;
    document.getElementById("priority").textContent=data.priority;
    document.getElementById("tasks").innerHTML=(data.tasks||[]).map(x=>`<span class="pill">${escapeHtml(x)}</span>`).join("");
    lastReply=data.professionalReply||"";
    document.getElementById("reply").textContent=lastReply;
    document.getElementById("resultCard").classList.remove("hidden");
    msg.textContent="Done.";
  }catch(e){msg.className="small error";msg.textContent=e.message}
  finally{btn.disabled=false}
};

document.getElementById("clearBtn").onclick=()=>{
  document.getElementById("message").value="";
  document.getElementById("screenshot").value="";
  document.getElementById("resultCard").classList.add("hidden");
  document.getElementById("appMsg").textContent="";
};

document.getElementById("copyBtn").onclick=async()=>{
  await navigator.clipboard.writeText(lastReply);
  document.getElementById("appMsg").textContent="Reply copied.";
};
document.getElementById("shortBtn").onclick=()=>{
  lastReply="Thanks for the message. I’ll take care of this and confirm the timing shortly.";
  document.getElementById("reply").textContent=lastReply;
};
document.getElementById("confBtn").onclick=()=>{
  lastReply="Understood. I’ll handle this and confirm the required timing and next steps.";
  document.getElementById("reply").textContent=lastReply;
};
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
init();
</script>
</body>
</html>
